<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Blue Prism Checklist · LA Ops Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/main.css"/>
<style>

  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:#f8fafc;color:#0f172a;min-height:100vh;padding:20px 14px}
  h1{font-size:18px;font-weight:700}h2{font-size:15px;font-weight:700;margin-bottom:16px}h3{font-size:14px;font-weight:700}
  .wrap{max-width:780px;margin:0 auto}
  .app-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
  .blue-bar{width:5px;height:38px;background:#2563eb;border-radius:99px;flex-shrink:0}
  .header-text{display:flex;align-items:center;gap:10px}
  .subtitle{font-size:12px;color:#64748b;margin-top:2px}
  .card{background:white;border-radius:12px;border:1px solid #e2e8f0;padding:20px 22px;margin-bottom:14px}
  .pill{font-size:12px;font-weight:700;padding:3px 12px;border-radius:20px;white-space:nowrap}
  .pill-draft{background:#f1f5f9;color:#64748b}
  .pill-pending{background:#fef9c3;color:#854d0e}
  .pill-submitted{background:#dbeafe;color:#1e40af}
  .pill-post{background:#f3e8ff;color:#6b21a8}
  .pill-complete{background:#dcfce7;color:#15803d}

  /* TIMELINE */
  .timeline{display:flex;align-items:center;margin-bottom:24px}
  .tl-item{display:flex;flex-direction:column;align-items:center;gap:3px}
  .tl-circle{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;background:#e2e8f0;color:#94a3b8;transition:all .3s}
  .tl-circle.done{background:#16a34a;color:white}.tl-circle.active{background:#2563eb;color:white}
  .tl-label{font-size:10px;color:#94a3b8;white-space:nowrap;font-weight:400}
  .tl-label.active{color:#2563eb;font-weight:700}.tl-label.done{color:#16a34a}
  .tl-sub{font-size:9px;color:#94a3b8}
  .tl-line{flex:1;height:2px;background:#e2e8f0;margin:0 6px;margin-bottom:22px;transition:background .3s}
  .tl-line.done{background:#16a34a}

  /* STEPS TABS */
  .tabs{display:flex;gap:8px;margin-bottom:18px}
  .tab{flex:1;padding:9px 4px;border-radius:8px;border:1.5px solid #e2e8f0;background:white;color:#94a3b8;font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;font-family:inherit}
  .tab.active{border-color:#2563eb;background:#2563eb;color:white}
  .tab.done{border-color:#16a34a;background:#f0fdf4;color:#15803d}
  .tab:disabled{opacity:0.5;cursor:default}

  /* FORM */
  label.lbl{font-size:12px;font-weight:600;color:#64748b;margin-bottom:4px;display:block}
  label.lbl .req{color:#dc2626}
  input[type=text],input[type=email],input[type=date],select,textarea{width:100%;padding:9px 12px;font-size:13.5px;border:1.5px solid #e2e8f0;border-radius:8px;outline:none;color:#0f172a;font-family:inherit;background:white;transition:border-color .15s}
  input:focus,select:focus,textarea:focus{border-color:#2563eb}
  input.err-field{border-color:#dc2626!important}
  input:disabled{background:#f8fafc;color:#64748b;cursor:default}
  textarea{resize:vertical}
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .form-grid .full{grid-column:1/-1}
  .field-hint{font-size:11px;color:#94a3b8;margin-top:3px}
  .field-err{font-size:11px;color:#dc2626;margin-top:3px;display:none}

  /* PROGRESS */
  .progress-wrap{background:#e2e8f0;border-radius:99px;height:6px}
  .progress-bar{height:6px;border-radius:99px;transition:width .3s}
  .progress-header{display:flex;justify-content:space-between;margin-bottom:6px;font-size:12px;color:#64748b}
  .progress-header span:last-child{font-weight:700}

  /* SECTION CARD */
  .section-card{background:white;border-radius:12px;border:1px solid #e2e8f0;margin-bottom:12px;overflow:hidden}
  .section-head{padding:11px 18px;background:#fafafa;display:flex;justify-content:space-between;align-items:center;border-left-width:4px;border-left-style:solid}
  .section-head-left{display:flex;flex-direction:column;gap:2px}
  .section-title{font-size:13.5px;font-weight:700}
  .section-note{font-size:11px;font-weight:600}
  .section-prog{display:flex;align-items:center;gap:8px}
  .section-prog-bar{width:70px}
  .section-prog-pct{font-size:11px;color:#64748b;min-width:28px}
  .section-body{padding:4px 18px 10px}

  /* YN ITEMS */
  .yn-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-bottom:1px solid #f1f5f9}
  .yn-item:last-child{border-bottom:none}
  .yn-btns{display:flex;gap:5px;flex-shrink:0;padding-top:2px}
  .yn-btn{width:36px;height:26px;border:1.5px solid #e2e8f0;border-radius:6px;font-size:10px;font-weight:700;cursor:pointer;transition:all .12s;background:white;color:#94a3b8;font-family:inherit}
  .yn-btn.sel-Y{border-color:#16a34a;background:#dcfce7;color:#16a34a}
  .yn-btn.sel-N{border-color:#dc2626;background:#fee2e2;color:#dc2626}
  .yn-btn.sel-NA{border-color:#94a3b8;background:#f1f5f9;color:#64748b}
  .yn-btn:disabled{opacity:0.65;cursor:default}
  .yn-label{font-size:13px;color:#334155;line-height:1.55}

  /* BUTTONS */
  .btn{padding:10px 20px;border-radius:8px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;border:none;text-decoration:none;display:inline-flex;align-items:center;gap:6px;justify-content:center}
  .btn-primary{background:#2563eb;color:white}.btn-primary:hover{background:#1d4ed8}
  .btn-ghost{background:white;color:#64748b;border:1.5px solid #e2e8f0}.btn-ghost:hover{background:#f8fafc}
  .btn-success{background:#16a34a;color:white}.btn-success:hover{background:#15803d}
  .btn-success:disabled{opacity:0.5;cursor:default}
  .btn-row{display:flex;gap:10px;margin-top:4px}
  .btn-flex{flex:1}

  /* STATS */
  .stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
  .stat-card{background:#f8fafc;border-radius:8px;padding:12px 14px;border:1px solid #e2e8f0}
  .stat-label{font-size:11px;color:#64748b;margin-bottom:2px}
  .stat-val{font-size:22px;font-weight:700}

  /* MISC */
  .fail-box{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:14px;margin-bottom:16px}
  .fail-box-title{font-size:13px;font-weight:700;color:#b91c1c;margin-bottom:6px}
  .fail-box p{font-size:12px;color:#7f1d1d;margin-bottom:3px}
  .info-summary{background:#f8fafc;border-radius:8px;padding:14px;margin-bottom:16px;border:1px solid #e2e8f0}
  .info-row{display:flex;gap:10px;margin-bottom:4px}
  .info-key{font-size:12px;color:#64748b;min-width:130px}
  .info-val{font-size:12px;font-weight:600;color:#0f172a}
  .divider{border:none;border-top:1px solid #e2e8f0;margin:16px 0}
  .hidden{display:none!important}
  .locked-label{font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin:8px 0 10px}

  /* SUCCESS SCREEN */
  .success-screen{padding:40px 24px;text-align:center}
  .success-icon-wrap{width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,#16a34a,#059669);display:flex;align-items:center;justify-content:center;margin:0 auto 20px;box-shadow:0 8px 28px rgba(22,163,74,.3)}
  .success-icon-wrap svg{width:40px;height:40px;stroke:white;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
  .success-title{font-size:22px;font-weight:700;color:#0f172a;margin-bottom:8px}
  .success-sub{font-size:14px;color:#64748b;line-height:1.7;margin-bottom:22px}
  .success-id-box{display:inline-block;background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 24px;margin-bottom:22px}
  .success-id-label{font-size:11px;color:#64748b;font-weight:600;margin-bottom:4px}
  .success-id-val{font-size:18px;font-weight:700;color:#15803d;font-family:'Courier New',monospace;letter-spacing:.03em}
  .tracker-box{background:#f8fafc;border:1px solid #e2e8f0;border-radius:10px;padding:14px 16px;margin:0 auto 20px;text-align:left;max-width:100%}
  .tracker-box-title{font-size:11px;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px}
  .tracker-row-val{font-size:11px;color:#334155;font-family:'Courier New',monospace;word-break:break-all;line-height:1.7;background:white;border:1px solid #e2e8f0;border-radius:6px;padding:8px 10px;white-space:pre-wrap}
  .copy-btn-wrap{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
  .post-unlock-banner{background:linear-gradient(135deg,#eff6ff,#f0fdf4);border:1.5px solid #bbf7d0;border-radius:10px;padding:16px 20px;margin:20px auto 0;text-align:left}
  .post-unlock-title{font-size:14px;font-weight:700;color:#0f172a;margin-bottom:4px}
  .post-unlock-sub{font-size:12px;color:#64748b;margin-bottom:12px}
  .tracker-note{font-size:11px;color:#94a3b8;margin-top:16px;line-height:1.7;text-align:center}
  .tracker-note a{color:#2563eb;text-decoration:none}.tracker-note a:hover{text-decoration:underline}

  /* POST DONE */
  .done-screen{padding:48px 24px;text-align:center}
  .done-icon{font-size:52px;margin-bottom:16px}
  .done-title{font-size:20px;font-weight:700;margin-bottom:8px}
  .done-sub{font-size:13px;color:#64748b;line-height:1.7;margin-bottom:24px}

  @media(max-width:520px){
    .form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:1}
    .stats-row{grid-template-columns:1fr 1fr}
  }

/* Override body padding to work inside hub layout */
body{ padding: 0 !important; background: #f8fafc !important; }
.wrap{ padding: 20px 14px; }
</style>
</head>
<body>
<nav class="topnav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html"><span class="logo-pill">LA</span> Ops Hub</a>
    <div class="nav-links">

      <a href="blueprism.html" class="active" style="color:white;border-bottom-color:#2563eb">Blue Prism</a>
    </div>
  </div>
</nav>
<div class="wrap">

  <!-- HEADER -->
  <div class="app-header">
    <div class="header-text">
      <div class="blue-bar"></div>
      <div>
        <h1>Blue Prism Migration Checklist</h1>
        <div class="subtitle">Pre-migration preparation &amp; approval workflow</div>
      </div>
    </div>
    <span id="status-pill" class="pill pill-draft">Draft</span>
  </div>

  <!-- TIMELINE -->
  <div class="timeline" id="timeline"></div>

  <!-- MAIN CONTENT -->
  <div id="app"></div>

</div>
<script>
// ─── DATA ────────────────────────────────────────────────────────────────────
const TRACKER_URL = "https://pgone-my.sharepoint.com/:x:/r/personal/mora_ns_pg_com/_layouts/15/Doc.aspx?sourcedoc=%7BB006EF43-9669-42C6-B85D-3A3C86715F06%7D&file=Book.xlsx&action=editnew&mobileredirect=true";

const PRE_SECTIONS = [
  {id:"dev_package",label:"Dev Package Review",color:"#2563eb",note:"Pre-migration",items:[
    {id:"bp_proc",  label:"Business Process"},
    {id:"bp_obj",   label:"Business Objects"},
    {id:"queues",   label:"Queues"},
    {id:"ev_pre",   label:"Environment Variables"},
    {id:"no_otc",   label:"Package does not contain OTC Shared Objects (unless explicitly required)"},
  ]},
  {id:"migration_ticket",label:"Migration Ticket",color:"#0f172a",items:[
    {id:"uat",         label:"UAT Sign Off received from the business and attached to ticket"},
    {id:"bp_cl",       label:"BP VirtOps Migration Checklist Attached (Dev → QA section populated)"},
    {id:"blackbox",    label:"Dev Black Box successful run screenshot attached (5 runs AFTER last business process modification date)"},
    {id:"ticket_done", label:"Migration ticket created"},
  ]},
  {id:"credentials",label:"Credentials",color:"#7c3aed",items:[
    {id:"creds_present", label:"All required credentials confirmed to be present in QA"},
    {id:"new_creds",     label:"New credentials were created (if applicable)"},
    {id:"creds_updated", label:"All credentials were updated to grant permissions to the process"},
  ]},
  {id:"sharepoint",label:"SharePoint/FileShare Locations",color:"#059669",items:[
    {id:"sp_output", label:"Test folder for output report created"},
    {id:"sp_params", label:"Test folder for parameter files created"},
    {id:"sp_config", label:"Test folder for configuration files created"},
    {id:"sp_tech",   label:"All technical parameter and configuration files in Test Folder present and contain Test data"},
    {id:"sp_user",   label:"All user parameters and configuration files in Test Folder present and contain Test data"},
    {id:"sp_init",   label:"Initial output files created in Output folder if needed"},
  ]},
  {id:"others",label:"Others",color:"#be185d",items:[
    {id:"other_int",  label:"Any other integration (BAPIS, or others) has the right permissions assigned"},
    {id:"other_req",  label:"Any other special requirement is assigned and approved"},
    {id:"change_log", label:"Actions tracked via the Change Log Tracker"},
  ]},
];

const POST_SECTIONS = [
  {id:"ev_post",label:"Environment Variables",color:"#d97706",note:"After migration",items:[
    {id:"ev_test",    label:"Contents of environment variables confirmed to be set to 'Test' or 'QA' settings"},
    {id:"ev_updated", label:"EV is updated according to the required Environment (when EV is not new)"},
  ]},
  {id:"sql",label:"SQL / Simplement / DBX",color:"#475569",note:"After migration",items:[
    {id:"sql_perms", label:"All permissions and roles granted to the SQL user (tables, SP, Views, execution)"},
  ]},
];

// ─── STATE ────────────────────────────────────────────────────────────────────
let state = {
  phase: "pre",   // pre | success | post | done
  subStep: 1,     // 1=package info | 2=checklist | 3=review
  form: {
    packageName:"", ritm:"", date:new Date().toISOString().split("T")[0],
    migrationOwnerEmail:"", migrationApprover:"", approverPeerEmail:"", notes:"",
  },
  checks: {},
  postChecks: {},
  requestId: null,
};

// ─── PHASES ───────────────────────────────────────────────────────────────────
const PHASES = [
  {key:"pre",     label:"Pre-Migration",  sub:"Fill checklist"},
  {key:"success", label:"Submitted",      sub:"Emails sent"},
  {key:"post",    label:"Post-Migration", sub:"After deployment"},
  {key:"done",    label:"Complete",       sub:"All done"},
];

// ─── RENDER ───────────────────────────────────────────────────────────────────
function render(){
  renderTimeline();
  renderStatusPill();
  const app = document.getElementById("app");
  if      (state.phase==="pre")     app.innerHTML = renderPre();
  else if (state.phase==="success") app.innerHTML = renderSuccess();
  else if (state.phase==="post")    app.innerHTML = renderPost();
  else if (state.phase==="done")    app.innerHTML = renderDone();
}

function renderTimeline(){
  const idx = PHASES.findIndex(p=>p.key===state.phase);
  document.getElementById("timeline").innerHTML = PHASES.map((p,i)=>`
    <div class="tl-item">
      <div class="tl-circle ${i<idx?"done":i===idx?"active":""}">${i<idx?"✓":i+1}</div>
      <span class="tl-label ${i<idx?"done":i===idx?"active":""}">${p.label}</span>
      <span class="tl-sub">${p.sub}</span>
    </div>${i<PHASES.length-1?`<div class="tl-line ${i<idx?"done":""}"></div>`:""}`).join("");
}

function renderStatusPill(){
  const map = {
    pre:     ["Draft",           "pill-draft"],
    success: ["Submitted ✓",    "pill-submitted"],
    post:    ["Post-Migration",  "pill-post"],
    done:    ["Complete ✓",     "pill-complete"],
  };
  const [label, cls] = map[state.phase]||["Draft","pill-draft"];
  const el = document.getElementById("status-pill");
  el.className = "pill "+cls;
  el.textContent = label;
}

// ─── HELPERS ─────────────────────────────────────────────────────────────────
function pct(n,t){return t?Math.round(n/t*100):0;}
function bar(p,color){
  const c = p===100?"#16a34a":color;
  return `<div class="progress-wrap"><div class="progress-bar" style="width:${p}%;background:${c}"></div></div>`;
}
function progressHeader(label,a,t,color){
  const p=pct(a,t);
  return `<div class="progress-header"><span>${label}</span><span style="color:${p===100?"#16a34a":color}">${a}/${t} — ${p}%</span></div>${bar(p,color)}`;
}
function preAns(){ return PRE_SECTIONS.reduce((a,s)=>a+s.items.filter(i=>state.checks[i.id]).length,0); }
function preTot(){ return PRE_SECTIONS.reduce((a,s)=>a+s.items.length,0); }
function postAns(){ return POST_SECTIONS.reduce((a,s)=>a+s.items.filter(i=>state.postChecks[i.id]).length,0); }
function postTot(){ return POST_SECTIONS.reduce((a,s)=>a+s.items.length,0); }
function failItems(){ return PRE_SECTIONS.flatMap(s=>s.items.filter(i=>state.checks[i.id]==="N")); }
function isEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

function sectionCard(section, checksObj, disabled){
  const total   = section.items.length;
  const answered= section.items.filter(i=>checksObj[i.id]).length;
  const p       = pct(answered,total);
  const items   = section.items.map(item=>{
    const v = checksObj[item.id];
    return `<div class="yn-item">
      <div class="yn-btns">${["Y","N","N/A"].map(opt=>`
        <button class="yn-btn${v===opt?" sel-"+opt.replace("/",""):""}" ${disabled?"disabled":""}
          onclick="setCheck('${section.id}','${item.id}','${opt}')">${opt}</button>`).join("")}
      </div>
      <span class="yn-label">${item.label}</span>
    </div>`;
  }).join("");
  return `<div class="section-card">
    <div class="section-head" style="border-left-color:${section.color}">
      <div class="section-head-left">
        <span class="section-title">${section.label}</span>
        ${section.note?`<span class="section-note" style="color:${section.color}">— ${section.note}</span>`:""}
      </div>
      <div class="section-prog">
        <div class="section-prog-bar">${bar(p,section.color)}</div>
        <span class="section-prog-pct">${p}%</span>
      </div>
    </div>
    <div class="section-body">${items}</div>
  </div>`;
}

function setCheck(sId,iId,opt){
  const isPost = POST_SECTIONS.some(s=>s.id===sId);
  const obj = isPost ? state.postChecks : state.checks;
  if(obj[iId]===opt) delete obj[iId]; else obj[iId]=opt;
  render();
}

function updateForm(k,v){ state.form[k]=v; }

// ─── VALIDATION ───────────────────────────────────────────────────────────────
function validateStep1(){
  let ok = true;
  const fields = [
    {id:"f-packageName",   val:state.form.packageName,        check:v=>v.trim().length>0, msg:"Package name is required"},
    {id:"f-ritm",          val:state.form.ritm,               check:v=>v.trim().length>0, msg:"RITM # is required"},
    {id:"f-ownerEmail",    val:state.form.migrationOwnerEmail, check:isEmail,              msg:"Valid email required — e.g. doe.j@pg.com"},
    {id:"f-approver",      val:state.form.migrationApprover,   check:isEmail,              msg:"Valid email required — e.g. doe.j@pg.com"},
    {id:"f-peerEmail",     val:state.form.approverPeerEmail,   check:isEmail,              msg:"Valid email required — e.g. doe.j@pg.com"},
  ];
  fields.forEach(f=>{
    const el  = document.getElementById(f.id);
    const err = document.getElementById(f.id+"-err");
    if(!el) return;
    const valid = f.check(f.val);
    el.classList.toggle("err-field", !valid);
    if(err){ err.textContent=f.msg; err.style.display=valid?"none":"block"; }
    if(!valid) ok=false;
  });
  return ok;
}

// ─── PRE PHASE ───────────────────────────────────────────────────────────────
function renderPre(){
  const tabs = ["Package Info","Checklist","Review & Submit"].map((label,i)=>{
    const n=i+1;
    const cls = state.subStep===n?"tab active":state.subStep>n?"tab done":"tab";
    return `<button class="${cls}" onclick="goTab(${n})">${state.subStep>n?"✓ ":""}${label}</button>`;
  }).join("");
  const content = state.subStep===1 ? renderStep1() : state.subStep===2 ? renderStep2() : renderStep3();
  return `<div class="tabs">${tabs}</div>${content}`;
}

function goTab(n){ if(n<state.subStep||(n===2)||(n===3)) state.subStep=n, render(); }

function renderStep1(){
  const f = state.form;
  return `<div class="card">
    <h2>Package Info</h2>
    <div class="form-grid">
      <div class="full">
        <label class="lbl">Package Name <span class="req">*</span></label>
        <input type="text" id="f-packageName" value="${f.packageName}" placeholder="e.g. OTC-OM-Invoice-Processing"
          oninput="updateForm('packageName',this.value)"/>
        <div class="field-err" id="f-packageName-err"></div>
      </div>
      <div>
        <label class="lbl">Migration Environment</label>
        <input type="text" value="Dev → QA" disabled/>
      </div>
      <div>
        <label class="lbl">Date</label>
        <input type="date" value="${f.date}" onchange="updateForm('date',this.value)"/>
      </div>
      <div>
        <label class="lbl">RITM # <span class="req">*</span></label>
        <input type="text" id="f-ritm" value="${f.ritm}" placeholder="RITM #"
          oninput="updateForm('ritm',this.value)"/>
        <div class="field-err" id="f-ritm-err"></div>
      </div>
      <div>
        <label class="lbl">Migration Owner Email <span class="req">*</span></label>
        <input type="email" id="f-ownerEmail" value="${f.migrationOwnerEmail}" placeholder="doe.j@pg.com"
          oninput="updateForm('migrationOwnerEmail',this.value)"/>
        <div class="field-hint">Format: doe.j@pg.com</div>
        <div class="field-err" id="f-ownerEmail-err"></div>
      </div>
      <div>
        <label class="lbl">Migration Approver <span class="req">*</span></label>
        <input type="email" id="f-approver" value="${f.migrationApprover}" placeholder="doe.j@pg.com"
          oninput="updateForm('migrationApprover',this.value)"/>
        <div class="field-hint">Format: doe.j@pg.com</div>
        <div class="field-err" id="f-approver-err"></div>
      </div>
      <div class="full">
        <label class="lbl">Approver Peer Email <span class="req">*</span></label>
        <input type="email" id="f-peerEmail" value="${f.approverPeerEmail}" placeholder="doe.j@pg.com"
          oninput="updateForm('approverPeerEmail',this.value)"/>
        <div class="field-hint">Format: doe.j@pg.com</div>
        <div class="field-err" id="f-peerEmail-err"></div>
      </div>
    </div>
    <div style="margin-top:20px;display:flex;justify-content:flex-end">
      <button class="btn btn-primary" onclick="step1Next()">Next: Checklist →</button>
    </div>
  </div>`;
}

function step1Next(){ if(validateStep1()){ state.subStep=2; render(); } }

function renderStep2(){
  const an=preAns(), tot=preTot();
  return `
    <div class="card" style="padding:12px 16px;margin-bottom:14px">
      ${progressHeader("Pre-migration checklist progress", an, tot, "#2563eb")}
    </div>
    ${PRE_SECTIONS.map(s=>sectionCard(s,state.checks,false)).join("")}
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="state.subStep=1;render()">← Back</button>
      <button class="btn btn-primary btn-flex" onclick="state.subStep=3;render()">Review & Submit →</button>
    </div>`;
}

function renderStep3(){
  const an=preAns(), tot=preTot();
  const yCount = Object.values(state.checks).filter(v=>v==="Y").length;
  const fails  = failItems();
  const f = state.form;
  const failHtml = fails.length ? `<div class="fail-box">
    <div class="fail-box-title">⚠ ${fails.length} item(s) marked as N — will be visible to approvers</div>
    ${fails.map(f=>`<p>✗ ${f.label}</p>`).join("")}
  </div>` : "";
  return `<div class="card">
    <h2>Review & Submit</h2>
    <div class="stats-row">
      <div class="stat-card"><div class="stat-label">Answered</div><div class="stat-val" style="color:#2563eb">${an}</div></div>
      <div class="stat-card"><div class="stat-label">Passed (Y)</div><div class="stat-val" style="color:#16a34a">${yCount}</div></div>
      <div class="stat-card"><div class="stat-label">Failed (N)</div><div class="stat-val" style="color:${fails.length?"#dc2626":"#64748b"}">${fails.length}</div></div>
    </div>
    ${failHtml}
    <div class="info-summary">
      ${[["Package Name",f.packageName],["Migration Env","Dev → QA"],["RITM #",f.ritm],["Date",f.date],["Migration Owner Email",f.migrationOwnerEmail],["Migration Approver",f.migrationApprover],["Approver Peer Email",f.approverPeerEmail]].map(([k,v])=>`
        <div class="info-row"><span class="info-key">${k}</span><span class="info-val">${v||"—"}</span></div>`).join("")}
    </div>
    <label class="lbl">Additional notes (optional)</label>
    <textarea rows="3" placeholder="Any extra context or blockers..."
      oninput="updateForm('notes',this.value)" style="margin-bottom:18px">${f.notes}</textarea>
    <div class="btn-row">
      <button class="btn btn-ghost" onclick="state.subStep=2;render()">← Back</button>
      <button class="btn btn-primary btn-flex" onclick="doSubmit()">📧 Send to Approvers →</button>
    </div>
  </div>`;
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
function generateRequestId(){
  const ritm = state.form.ritm.replace(/[^a-zA-Z0-9]/g,"").toUpperCase();
  const ts   = Date.now().toString().slice(-4);
  return `${ritm}-SAO-${ts}`;
}

function doSubmit(){
  state.requestId = generateRequestId();
  state.phase = "success";
  render(); // show success screen first so user sees it immediately
  // Small delay so the page renders before the email client opens
  setTimeout(openSubmitEmail, 300);
}

function buildSubmitEmailBody(){
  const f   = state.form;
  const an  = preAns(), tot = preTot();
  const fails = PRE_SECTIONS.flatMap(s=>s.items.filter(i=>state.checks[i.id]==="N").map(i=>`[${s.label}] ${i.label}`));

  let b = `Hi,\n\n`;
  b += `A new Blue Prism pre-migration request has been submitted and requires your attention.\n\n`;
  b += `${"─".repeat(52)}\n`;
  b += `Request ID:           ${state.requestId}\n`;
  b += `Package Name:         ${f.packageName}\n`;
  b += `Migration:            Dev → QA\n`;
  b += `RITM #:               ${f.ritm}\n`;
  b += `Date:                 ${f.date}\n`;
  b += `Migration Owner:      ${f.migrationOwnerEmail}\n`;
  b += `Migration Approver:   ${f.migrationApprover}\n`;
  b += `Approver Peer:        ${f.approverPeerEmail}\n`;
  b += `${"─".repeat(52)}\n\n`;

  b += `CHECKLIST SUMMARY — ${an}/${tot} items answered`;
  if(fails.length) b += ` · ${fails.length} item(s) marked N`;
  b += `\n\n`;

  PRE_SECTIONS.forEach(s=>{
    b += `▌ ${s.label.toUpperCase()}\n`;
    s.items.forEach(i=>{
      const v = state.checks[i.id]||"—";
      b += `  [${v==="Y"?"✓":v==="N"?"✗":v}] ${i.label}\n`;
    });
    b += "\n";
  });

  if(fails.length){
    b += `${"─".repeat(52)}\nITEMS REQUIRING ATTENTION (marked N):\n`;
    fails.forEach(f => b += `  ✗ ${f}\n`);
    b += "\n";
  }

  if(f.notes){
    b += `${"─".repeat(52)}\nADDITIONAL NOTES:\n${f.notes}\n\n`;
  }

  b += `${"─".repeat(52)}\n`;
  b += `ACTION REQUIRED:\n`;
  b += `• ${f.approverPeerEmail} (Peer Approver) — please review the checklist above and contact the Migration Approver to coordinate sign-off.\n`;
  b += `• ${f.migrationApprover} (Migration Approver) — please review and approve this migration request.\n\n`;
  b += `Migration Tracker: ${TRACKER_URL}\n`;
  b += `Generated: ${new Date().toLocaleString()}`;
  return b;
}

function openSubmitEmail(){
  const f   = state.form;
  const to  = encodeURIComponent(f.approverPeerEmail);
  const cc  = encodeURIComponent(f.migrationApprover);
  const sub = encodeURIComponent(`[BP Migration - Action Required] ${f.packageName} — ${f.ritm} — Request ${state.requestId}`);
  const body= encodeURIComponent(buildSubmitEmailBody());
  const a   = document.createElement("a");
  a.href    = `mailto:${to}?cc=${cc}&subject=${sub}&body=${body}`;
  a.style.display = "none";
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>document.body.removeChild(a), 1000);
}

// ─── SUCCESS SCREEN ───────────────────────────────────────────────────────────
function renderSuccess(){
  const f = state.form;
  const row = buildTrackerRow(); // returns {cols, tsv} and stores TSV in state._trackerTSV
  return `<div class="card success-screen">
    <div class="success-icon-wrap">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>
    <div class="success-title">Request Submitted Successfully!</div>
    <div class="success-sub">
      Emails have been sent to <strong>${f.approverPeerEmail}</strong> (Peer Approver)<br/>
      and <strong>${f.migrationApprover}</strong> (Approver) for coordination.<br/>
      <span style="font-size:12px;color:#94a3b8">If your email client didn't open automatically, use the button below.</span>
    </div>

    <div class="success-id-box">
      <div class="success-id-label">Request ID</div>
      <div class="success-id-val">${state.requestId}</div>
    </div>

    <div style="margin-bottom:18px">
      <a id="resend-email-btn"
        href="mailto:${encodeURIComponent(f.approverPeerEmail)}?cc=${encodeURIComponent(f.migrationApprover)}&subject=${encodeURIComponent('[BP Migration - Action Required] '+f.packageName+' — '+f.ritm+' — Request '+state.requestId)}&body=${encodeURIComponent(buildSubmitEmailBody())}"
        class="btn btn-ghost" style="font-size:12px;padding:7px 16px;text-decoration:none">
        📧 Re-open email if it didn't launch
      </a>
    </div>

    <!-- Tracker row -->
    <div class="tracker-box">
      <div class="tracker-box-title">📋 Migration Tracker — Copy this row and paste it into the Excel</div>
      <div style="overflow-x:auto;margin-bottom:10px">
        <table style="border-collapse:collapse;font-size:11px;font-family:'Courier New',monospace;min-width:100%">
          <thead>
            <tr>${row.cols.map(c=>`<th style="background:#f1f5f9;border:1px solid #e2e8f0;padding:5px 8px;text-align:left;white-space:nowrap;font-weight:700;color:#64748b;font-size:10px">${c.header}</th>`).join("")}</tr>
          </thead>
          <tbody>
            <tr>${row.cols.map(c=>`<td style="border:1px solid #e2e8f0;padding:5px 8px;white-space:nowrap;color:#0f172a">${c.value||""}</td>`).join("")}</tr>
          </tbody>
        </table>
      </div>
      <div class="copy-btn-wrap">
        <button class="btn btn-ghost" id="copy-btn" onclick="copyRow()" style="font-size:12px;padding:7px 14px">📄 Copy row to clipboard</button>
        <a href="${TRACKER_URL}" target="_blank" class="btn btn-primary" style="font-size:12px;padding:7px 14px">📊 Open Migration Tracker</a>
      </div>
      <div style="font-size:11px;color:#94a3b8;margin-top:8px">After copying, open the Excel → click the first empty row → Paste (Ctrl+V). Each value goes into its own column automatically.</div>
    </div>

    <!-- Unlock Post-Migration -->
    <div class="post-unlock-banner">
      <div class="post-unlock-title">🚀 Ready to continue after deployment?</div>
      <div class="post-unlock-sub">Once the migration is deployed to the environment, complete the post-migration verification items below.</div>
      <button class="btn btn-success btn-flex" style="width:100%" onclick="state.phase='post';render()">Continue to Post-Migration Checklist →</button>
    </div>

    <div class="tracker-note">
      ℹ️ Request <strong>${state.requestId}</strong> logged on ${new Date().toLocaleDateString()}<br/>
      Columns: Request ID · Package Name · RITM # · Migration Owner · Approver · Peer Approver · Date · Failed Items
    </div>
  </div>`;
}

function buildTrackerRow(){
  const f = state.form;
  const fails = failItems().map(i=>i.label).join("; ")||"None";
  const cols = [
    {header:"Request ID",        value: state.requestId},
    {header:"Package Name",      value: f.packageName},
    {header:"RITM #",            value: f.ritm},
    {header:"Migration Owner",   value: f.migrationOwnerEmail},
    {header:"Migration Approver",value: f.migrationApprover},
    {header:"Approver Peer",     value: f.approverPeerEmail},
    {header:"Date",              value: f.date},
    {header:"Failed Items",      value: fails},
  ];
  // Store TSV in state so copyRow reads from here, never from the DOM
  state._trackerTSV = cols.map(c=>c.value).join("\t");
  return {cols, tsv: state._trackerTSV};
}

function copyRow(){
  const tsv = state._trackerTSV || "";
  if(!tsv){ alert("Nothing to copy yet."); return; }

  // Try modern clipboard API first, fall back to execCommand
  const doCopy = () => {
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(tsv);
    }
    // execCommand fallback (works in most corporate browsers)
    const ta = document.createElement("textarea");
    ta.value = tsv;
    ta.style.cssText = "position:fixed;top:-999px;left:-999px;opacity:0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    return Promise.resolve();
  };

  doCopy().then(()=>{
    const btn = document.getElementById("copy-btn");
    if(!btn) return;
    btn.textContent = "✓ Copied!";
    btn.style.borderColor = "#16a34a";
    btn.style.color = "#16a34a";
    setTimeout(()=>{
      btn.textContent = "📄 Copy row to clipboard";
      btn.style.borderColor = "";
      btn.style.color = "";
    }, 2500);
  }).catch(()=>{
    // Last resort: prompt user to manually copy
    window.prompt("Copy this row (Ctrl+C / Cmd+C), then paste into Excel:", tsv);
  });
}

// ─── POST PHASE ───────────────────────────────────────────────────────────────
function renderPost(){
  const pan=postAns(), ptot=postTot(), pp=pct(pan,ptot);
  const canComplete = pp===100;
  return `
    <div style="background:#f0fdf4;border:1.5px solid #bbf7d0;border-radius:10px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;gap:10px">
      <span style="font-size:20px">✓</span>
      <div>
        <div style="font-size:13px;font-weight:700;color:#15803d">Pre-migration approved — deployment done</div>
        <div style="font-size:12px;color:#166534">Complete the post-migration items below to close this request.</div>
      </div>
    </div>

    <div class="card" style="padding:12px 16px;margin-bottom:14px">
      ${progressHeader("Post-migration completion", pan, ptot, "#d97706")}
    </div>

    ${POST_SECTIONS.map(s=>sectionCard(s,state.postChecks,false)).join("")}

    <div class="locked-label">Pre-migration checklist (locked)</div>
    ${PRE_SECTIONS.map(s=>sectionCard(s,state.checks,true)).join("")}

    <button class="btn btn-success" style="width:100%;padding:13px 0;font-size:14px;margin-top:8px"
      ${canComplete?"":"disabled"} onclick="doPostComplete()">
      ${canComplete?"✓ Mark as Complete & Send Final Summary":"Complete all post-migration items first ("+pp+"%)"}
    </button>`;
}

function doPostComplete(){
  state.phase="done";
  render();
}

function buildPostEmail(){
  const f = state.form;
  let b=`Hi,\n\nThe Blue Prism migration request ${state.requestId} has been fully completed.\n\n`;
  b+=`Package:     ${f.packageName}\nRITM #:      ${f.ritm}\nDate:        ${new Date().toLocaleDateString()}\n\n`;
  b+=`POST-MIGRATION VERIFICATION\n${"─".repeat(40)}\n`;
  POST_SECTIONS.forEach(s=>{
    b+=`\n▌ ${s.label.toUpperCase()}\n`;
    s.items.forEach(i=>{const v=state.postChecks[i.id]||"—";b+=`  [${v==="Y"?"✓":v==="N"?"✗":v}] ${i.label}\n`;});
  });
  b+=`\n${"─".repeat(40)}\nMigration Tracker: ${TRACKER_URL}\nGenerated: ${new Date().toLocaleString()}`;
  return b;
}

// ─── DONE SCREEN ─────────────────────────────────────────────────────────────
function renderDone(){
  return `<div class="card done-screen">
    <div class="done-icon">🎉</div>
    <div class="done-title">Migration Complete!</div>
    <div class="done-sub">
      <strong>${state.form.packageName}</strong> has passed all pre and post-migration checks.<br/>
      Request ID: <code style="font-family:monospace;font-weight:700;color:#15803d">${state.requestId}</code><br/><br/>
      A completion summary has been sent to both approvers.
    </div>
    <a href="${TRACKER_URL}" target="_blank" class="btn btn-primary" style="margin-bottom:12px">📊 Update Migration Tracker</a><br/>
    <button class="btn btn-ghost" style="font-size:12px;margin-top:8px" onclick="resetAll()">+ Start New Request</button>
  </div>`;
}

function resetAll(){
  state={phase:"pre",subStep:1,form:{packageName:"",ritm:"",date:new Date().toISOString().split("T")[0],migrationOwnerEmail:"",migrationApprover:"",approverPeerEmail:"",notes:""},checks:{},postChecks:{},requestId:null};
  render();
}

// ─── BOOT ─────────────────────────────────────────────────────────────────────
render();
</script>
