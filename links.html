<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="assets/css/main.css"/>
</head>
<body>
<nav class="topnav">
  <div class="nav-inner">
    <a class="nav-logo" href="index.html"><span class="logo-pill">LA</span> Ops Hub</a>
    <div class="nav-links">
      <a href="report.html">Weekly report</a>
      <a href="prompts.html">Prompt library</a>

<div class="page-header">
  <h1>Useful links</h1>
  <p>Everything your team uses daily — in one place. Add new links by editing <code>data/links.json</code> on GitHub.</p>
</div>

<div class="page-content">
  <div id="links-container"></div>
</div>

<footer class="footer">
  <p>LA Ops Hub · Built by Ops team · <a href="https://github.com" target="_blank">Edit links on GitHub</a></p>
</footer>

<script>
const links = {
  "Microsoft 365": [
    { icon: "📧", title: "Outlook Web", desc: "Email and calendar", url: "https://outlook.office.com" },
    { icon: "💬", title: "Microsoft Teams", desc: "Chat, meetings, and channels", url: "https://teams.microsoft.com" },
    { icon: "✨", title: "Microsoft Copilot", desc: "AI assistant for M365", url: "https://copilot.microsoft.com" },
    { icon: "📁", title: "SharePoint home", desc: "Document management and sites", url: "https://sharepoint.com" },
    { icon: "📊", title: "Excel Online", desc: "Spreadsheets in the browser", url: "https://office.com/launch/excel" },
    { icon: "📝", title: "Word Online", desc: "Documents in the browser", url: "https://office.com/launch/word" }
  ],
  "Project tools": [
    { icon: "🎯", title: "JIRA board", desc: "Project tracking and tickets", url: "https://jira.atlassian.com" },
    { icon: "📋", title: "Team backlog", desc: "Sprint planning and backlog", url: "https://jira.atlassian.com" },
    { icon: "📈", title: "JIRA reports", desc: "Velocity, burndown, sprint reports", url: "https://jira.atlassian.com" }
  ],
  "SharePoint sites": [
    { icon: "⚙️", title: "Ops team site", desc: "Main operations documents and SOPs", url: "https://sharepoint.com" },
    { icon: "👥", title: "HR site", desc: "Policies, forms, and HR documents", url: "https://sharepoint.com" },
    { icon: "💰", title: "Finance site", desc: "Budget reports and financial docs", url: "https://sharepoint.com" },
    { icon: "💻", title: "IT site", desc: "Tech requests, guides, and IT docs", url: "https://sharepoint.com" }
  ],
  "This platform": [
    { icon: "📊", title: "Weekly report", desc: "Auto-generated ops summary", url: "report.html" },
    { icon: "✨", title: "Prompt library", desc: "Best MS Copilot prompts", url: "prompts.html" },
    { icon: "✉️", title: "Email generator", desc: "Project kickoff and feedback emails", url: "emails.html" },
    { icon: "📚", title: "Wiki & SOPs", desc: "Standard operating procedures", url: "wiki.html" },
    { icon: "❓", title: "AMA", desc: "Ask the team anything", url: "ama.html" }
  ]
};

const container = document.getElementById('links-container');
Object.entries(links).forEach(([group, items]) => {
  container.innerHTML += `<div class="link-group-title">${group}</div>
  <div class="links-grid">
    ${items.map(l => `
      <a class="link-card" href="${l.url}" ${l.url.startsWith('http') ? 'target="_blank" rel="noopener"' : ''}>
        <div class="link-card-icon">${l.icon}</div>
        <div class="link-card-title">${l.title}</div>
        <div class="link-card-desc">${l.desc}</div>
        ${l.url.startsWith('http') ? `<div class="link-card-url">${l.url.replace('https://','')}</div>` : ''}
      </a>`).join('')}
  </div>`;
});
</script>
</body>
</html>
